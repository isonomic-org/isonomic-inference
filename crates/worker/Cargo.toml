[package]
name = "isonomic-worker"
description = "Lifecycle of a model worker process: lazy start, probes, recovery, idle unload, memory gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
isonomic-inference-core = { path = "../inference-core" }
getrandom = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "net", "sync", "io-util", "rt", "macros", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
isonomic-inference-testkit = { path = "../testkit" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
