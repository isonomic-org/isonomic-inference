[package]
name = "isonomic-model-protocol-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

# Not part of the workspace: fuzzing needs a nightly toolchain and
# libfuzzer, neither of which the protocol crate itself may depend on.
# Run with `cargo +nightly fuzz run <target>` from crates/protocol.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The server feature adds the accept target and the responses format.
isonomic-model-protocol = { path = "..", features = ["server"] }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "accept"
path = "fuzz_targets/accept.rs"
test = false
doc = false
bench = false
